<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gravity Visualizer Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --border-color: #d1d5db;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh; height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: var(--shadow-md);
            z-index: 120;
            transition: var(--transition);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            flex-wrap: wrap;
        }

        .control-group:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .control-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        select, button, input[type="text"], input[type="number"] {
            padding: 8px 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            min-height: 36px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        select:hover, button:hover {
            border-color: var(--accent-primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        select:focus, button:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: var(--radius-sm);
        }

        .header-right {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
        }

        @media (max-width: 900px) {
            .header {
                padding: 8px;
            }
            .control-group.desktop-only {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .header.expanded .control-group.desktop-only {
                display: flex;
                width: 100%;
            }
            .header.expanded {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* Main grid */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .viewport {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .viewport:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-lg);
        }

        .viewport canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .viewport-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
            pointer-events: none;
        }

        /* Side panel */
        .side-panel-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 350px;
            max-width: 90vw;
            background: var(--bg-secondary);
            border-left: 2px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .side-panel-overlay.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-tertiary);
        }

        .panel-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: var(--radius-md);
            margin: 16px 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            padding: 10px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .preset-btn {
            padding: 6px 4px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .object-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
        }

        .object-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .object-item:last-child { border-bottom: none; }
        .object-item:hover { background: var(--bg-tertiary); }
        .object-item.selected {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent-primary);
        }

        .object-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .object-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .object-name {
            font-weight: 600;
            font-size: 13px;
        }

        .object-mass {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Info card */
        .info-card {
            position: fixed;
            bottom: 80px;
            left: 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-lg);
            z-index: 150;
            min-width: 240px;
            display: none;
            animation: slideUp 0.25s ease;
        }

        .info-card.visible {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .info-label { color: var(--text-secondary); }
        .info-value { font-family: 'JetBrains Mono', monospace; color: var(--success); font-weight: 600; }

        .status-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

        @media (max-width: 1000px) {
            .main-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

<header class="header" id="header">
    <button class="hamburger" id="hamburgerBtn" aria-label="Меню">☰</button>
    <div class="logo">🌌 Gravity Pro</div>

    <div class="control-group desktop-only">
        <span class="control-label">Тема</span>
        <select id="themeSel" title="Переключить тему">
            <option value="dark">🌙 Тёмная</option>
            <option value="light">☀️ Светлая</option>
        </select>
    </div>

    <div class="control-group desktop-only">
        <span class="control-label">Единицы</span>
        <select id="unitSel" title="Система единиц">
            <option value="si">СИ</option>
            <option value="astro">Астро</option>
        </select>
    </div>

    <div class="control-group" style="gap: 8px;">
        <button id="playPauseBtn" class="btn-icon" title="Пауза / Старт (Space)">⏸</button>
        <input type="range" id="timeScaleSlider" min="-4" max="4" step="0.1" value="1" title="Скорость симуляции" style="width: 80px;">
        <span class="time-display" id="timeScaleVal" style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px;">x1.0</span>
    </div>

    <div class="control-group desktop-only">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;" title="Учитывать релятивистские поправки">
            <input type="checkbox" id="relToggle" checked>
            <span class="control-label">Релятивизм</span>
        </label>
    </div>

    <div class="control-group desktop-only">
        <span class="control-label">Столк.</span>
        <select id="collMode" title="Режим столкновений">
            <option value="merge">Слияние</option>
            <option value="elastic">Упругий</option>
            <option value="fragment">Фрагментация</option>
            <option value="bh" selected>ЧД</option>
        </select>
    </div>

    <button id="stopBtn" class="btn-danger" title="Экстренная остановка">⛔ СТОП</button>

    <div class="header-right">
        <button id="panelToggleBtn" class="btn-primary" title="Панель управления">⚙️ Панель</button>
    </div>
</header>

<main class="main-container">
    <div class="viewport" id="vp-3d-side">
        <div class="viewport-label">3D Сбоку</div>
        <div class="legend">Клик — выбор</div>
    </div>
    <div class="viewport" id="vp-3d-iso">
        <div class="viewport-label">3D Изометрия</div>
    </div>
    <div class="viewport" id="vp-2d-top">
        <div class="viewport-label">2D Вид сверху</div>
        <div class="legend">Искривление</div>
    </div>
    <div class="viewport" id="vp-2d-side">
        <div class="viewport-label">2D Сбоку</div>
        <div class="legend">Векторы скоростей</div>
    </div>
    <div class="viewport" id="vp-minkowski">
        <div class="viewport-label">Диаграмма Минковского</div>
        <div class="legend">ct vs x</div>
    </div>
</main>

<div class="side-panel-overlay" id="sidePanel">
    <div class="panel-header">
        <h2 style="font-size:18px; font-weight:700;">🛠 Управление</h2>
        <button id="closePanelBtn" style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="panel-tabs">
        <button class="tab-btn active" data-panel="objects">📦 Объекты</button>
        <button class="tab-btn" data-panel="system">⚙️ Система</button>
    </div>
    <div class="tab-content active" id="panel-objects">
        <div class="form-group">
            <label>Быстрое добавление</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="app.addPreset('star')">⭐ Звезда</button>
                <button class="preset-btn" onclick="app.addPreset('planet')">🪐 Планета</button>
                <button class="preset-btn" onclick="app.addPreset('bh')">🌑 Ч. дыра</button>
            </div>
        </div>
        <div class="form-group">
            <label>Объекты в сцене (<span id="objectCount">0</span>)</label>
            <ul class="object-list" id="objList"></ul>
        </div>
        <button id="btnDeleteSelected" class="btn-danger" style="width:100%; margin-bottom:8px;">🗑 Удалить выбранный (Del)</button>
        <button id="btnSetMinkRef" class="btn-primary" style="width:100%; margin-bottom:8px;">🎯 Отсчёт Минковского</button>
        <div class="form-group">
            <label>Масса (кг)</label>
            <input type="number" id="inpMass" value="5e12" step="any">
        </div>
        <div class="form-group">
            <label>Плотность (кг/м³)</label>
            <input type="number" id="inpDensity" value="3000" step="any">
        </div>
        <div class="form-group">
            <label>Позиция X, Y, Z</label>
            <input type="text" id="inpPos" value="0, 0, 0">
        </div>
        <div class="form-group">
            <label>Скорость VX, VY, VZ</label>
            <input type="text" id="inpVel" value="0, 2, 0">
        </div>
        <button id="btnAddBody" class="btn-primary" style="width:100%;">➕ Добавить</button>
    </div>
    <div class="tab-content" id="panel-system">
        <div class="form-group">
            <label>Логи</label>
            <div id="logBox" style="background:var(--bg-primary); font-family:'JetBrains Mono',monospace; font-size:11px; padding:10px; border-radius:var(--radius-sm); max-height:180px; overflow-y:auto; border:1px solid var(--border-color); color:var(--success);"></div>
            <div style="display:flex; gap:6px; margin-top:6px;">
                <button onclick="app.clearLogs()" style="flex:1;">🗑 Очистить</button>
                <button onclick="app.saveLogs()" style="flex:1;">💾 Сохранить</button>
            </div>
        </div>
        <div class="form-group">
            <label>Данные</label>
            <button onclick="app.saveJSON()" style="width:100%; margin-bottom:6px;">📄 Экспорт JSON</button>
            <button id="importBtn" style="width:100%; margin-bottom:6px;">📂 Импорт JSON</button>
            <input type="file" id="fileInput" style="display:none" accept=".json">
            <button onclick="app.saveCSV()" style="width:100%; margin-bottom:6px;">📈 CSV</button>
        </div>
        <button onclick="app.saveScreenshots()" class="btn-primary" style="width:100%;">📷 Скриншоты (ZIP)</button>
        <button id="btnResetCam" class="btn-primary" style="width:100%; margin-top:6px;">🎥 Сброс камер (R)</button>
    </div>
</div>

<div class="info-card" id="infoCard">
    <div class="info-card-title" id="infoTitle">Объект</div>
    <div class="info-row"><span class="info-label">Масса</span><span class="info-value" id="infoMass">-</span></div>
    <div class="info-row"><span class="info-label">Скорость</span><span class="info-value" id="infoVel">-</span></div>
    <div class="info-row"><span class="info-label">Позиция</span><span class="info-value" id="infoPos">-</span></div>
    <div class="info-row"><span class="info-label">ID</span><span class="info-value" id="infoId" style="font-size:10px;">-</span></div>
</div>

<div class="status-bar">
    <div class="status-dot"></div>
    <span id="statusText">Инициализация...</span>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- CONFIG ----------
    const CFG = {
        G_SI: 6.67430e-11, C_SI: 299792458,
        G_ASTRO: 4.30091e-3, C_ASTRO: 1.0,
        SOFTENING: 0.5, RENDER_SCALE: 0.05,
        MAX_BODIES: 80, DT_BASE: 0.5,
        TRAIL_LEN: 120, HISTORY_BUF_LEN: 600
    };

    // ---------- STATE ----------
    const state = {
        running: true, timeScale: 1.0, time: 0,
        units: 'si', relativity: true, collisionMode: 'bh',
        logs: [], logEnabled: true,
        selectedBodyId: null, minkowskiRefId: null,
        historyBuffer: [], isRewinding: false,
        zoom3D: 80, zoom2D: 2.0, zoomMink: 10.0
    };

    // ---------- DOM REFS ----------
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const UI = {
        themeSel: $('#themeSel'), unitSel: $('#unitSel'),
        relToggle: $('#relToggle'), collMode: $('#collMode'),
        stopBtn: $('#stopBtn'), playPauseBtn: $('#playPauseBtn'),
        timeScaleSlider: $('#timeScaleSlider'), timeScaleVal: $('#timeScaleVal'),
        statusText: $('#statusText'), logBox: $('#logBox'),
        objList: $('#objList'), objectCount: $('#objectCount'),
        infoCard: $('#infoCard'), infoTitle: $('#infoTitle'),
        infoMass: $('#infoMass'), infoVel: $('#infoVel'),
        infoPos: $('#infoPos'), infoId: $('#infoId'),
        btnSetMinkRef: $('#btnSetMinkRef'), btnDeleteSelected: $('#btnDeleteSelected'),
        btnResetCam: $('#btnResetCam'), sidePanel: $('#sidePanel'),
        panelToggleBtn: $('#panelToggleBtn'), closePanelBtn: $('#closePanelBtn'),
        hamburgerBtn: $('#hamburgerBtn'), header: $('#header')
    };

    // ---------- HELPERS ----------
    function log(msg) {
        if(!state.logEnabled) return;
        const entry = `[${state.time.toFixed(2)}s] ${msg}`;
        state.logs.push(entry);
        if(UI.logBox) {
            UI.logBox.textContent += entry + '\n';
            UI.logBox.scrollTop = UI.logBox.scrollHeight;
        }
    }

    function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('gv-theme', t);
        if(UI.themeSel) UI.themeSel.value = t;
    }
    applyTheme(localStorage.getItem('gv-theme') || 'dark');

    // ---------- SCENE SETUP ----------
    const sceneSide = new THREE.Scene();
    const sceneIso  = new THREE.Scene();
    const camSide = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);
    const camIso  = new THREE.PerspectiveCamera(45, 1, 0.01, 5000);

    function setupScene(scene, cam, contId, initialPos) {
        const cont = document.getElementById(contId);
        scene.background = new THREE.Color('#0a0e1a');
        const ren = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer: true});
        ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        ren.setSize(cont.clientWidth, cont.clientHeight);
        cont.appendChild(ren.domElement);
        cam.position.set(...initialPos); cam.lookAt(0,0,0);
        const ctrl = new OrbitControls(cam, ren.domElement);
        ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;
        ctrl.minDistance = 15; ctrl.maxDistance = 300;
        ctrl.target.set(0,0,0);
        addStars(scene);
        scene.add(new THREE.GridHelper(200, 20, 0x374151, 0x1f2937));
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(5,10,7); scene.add(dl);
        return { scene, cam, ren, ctrl, cont };
    }

    function addStars(scene) {
        const g = new THREE.BufferGeometry();
        const p = new Float32Array(1500*3);
        for(let i=0; i<1500*3; i++) p[i] = (Math.random()-0.5)*900;
        g.setAttribute('position', new THREE.BufferAttribute(p,3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:0.6, color:0x60a5fa, transparent:true, opacity:0.8})));
    }

    const rSide = setupScene(sceneSide, camSide, 'vp-3d-side', [0, 15, 80]);
    const rIso  = setupScene(sceneIso, camIso, 'vp-3d-iso', [40, 40, 40]);

    function updateCameraZoom(dist) {
        state.zoom3D = dist;
        [camSide, camIso].forEach(c => c.position.copy(c.position.clone().normalize().multiplyScalar(dist)));
    }

    // ---------- 3D CLICK ----------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    document.getElementById('vp-3d-side').addEventListener('click', e => handle3DClick(e, rSide, camSide));
    document.getElementById('vp-3d-iso').addEventListener('click', e => handle3DClick(e, rIso, camIso));

    function handle3DClick(e, renderer, cam) {
        const rect = renderer.cont.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
        mouse.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
        raycaster.setFromCamera(mouse, cam);
        const hits = raycaster.intersectObjects(physics.bodies.map(b=>b.meshSide));
        if(hits.length > 0) selectBody(hits[0].object.userData.body.id);
        else deselectBody();
    }

    // ---------- 2D CLICK ----------
    ['vp-2d-side', 'vp-2d-top'].forEach(id => {
        document.getElementById(id).addEventListener('click', e => {
            const cont = e.currentTarget;
            const rect = cont.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const cx = rect.width/2, cy = rect.height/2;
            const scale = state.zoom2D;
            let closest = null, minD = 20;
            physics.bodies.forEach(b => {
                let sx, sy;
                if(id === 'vp-2d-top') {
                    sx = cx + b.pos.x * scale;
                    sy = cy - b.pos.z * scale;
                } else {
                    sx = cx + b.pos.x * scale;
                    sy = cy - b.pos.y * scale;
                }
                const d = Math.hypot(mx - sx, my - sy);
                if(d < minD) { minD = d; closest = b; }
            });
            if(closest) selectBody(closest.id);
            else deselectBody();
        });
    });

    // ---------- SELECTION ----------
    function selectBody(id) {
        state.selectedBodyId = id;
        updateObjListUI();
        updateInfoCard();
        physics.bodies.forEach(b => b.selectionRing.visible = (b.id === id));
    }

    function deselectBody() {
        state.selectedBodyId = null;
        updateObjListUI();
        UI.infoCard.classList.remove('visible');
        physics.bodies.forEach(b => b.selectionRing.visible = false);
    }

    function updateInfoCard() {
        const b = physics.bodies.find(b => b.id === state.selectedBodyId);
        if(!b) { UI.infoCard.classList.remove('visible'); return; }
        UI.infoCard.classList.add('visible');
        UI.infoTitle.textContent = b.isBH ? '🌑 Чёрная дыра' : `🪐 ${b.id}`;
        UI.infoMass.textContent = b.mass.toExponential(2) + ' kg';
        UI.infoVel.textContent = b.vel.length().toFixed(2) + ' m/s';
        UI.infoPos.textContent = `(${b.pos.x.toFixed(1)}, ${b.pos.y.toFixed(1)}, ${b.pos.z.toFixed(1)})`;
        UI.infoId.textContent = b.id;
    }

    function updateObjListUI() {
        UI.objList.innerHTML = '';
        UI.objectCount.textContent = physics.bodies.length;
        physics.bodies.forEach(b => {
            const li = document.createElement('li');
            li.className = 'object-item' + (b.id === state.selectedBodyId ? ' selected' : '');
            const icon = b.isBH ? '🌑' : '🪐';
            const refMark = b.id === state.minkowskiRefId ? '🎯 ' : '';
            li.innerHTML = `
                <div class="object-info">
                    <div class="object-icon" style="background: ${b.color};">${icon}</div>
                    <div>
                        <div class="object-name">${refMark}${b.id}</div>
                        <div class="object-mass">${b.mass.toExponential(1)} kg</div>
                    </div>
                </div>`;
            li.onclick = () => selectBody(b.id);
            UI.objList.appendChild(li);
        });
    }

    function deleteSelectedBody() {
        if(!state.selectedBodyId) return;
        const b = physics.bodies.find(b => b.id === state.selectedBodyId);
        if(!b) return;
        sceneSide.remove(b.meshSide, b.trailLine);
        sceneIso.remove(b.meshIso, b.trailLine);
        const idx = physics.bodies.findIndex(x => x.id === state.selectedBodyId);
        if(idx > -1) physics.bodies.splice(idx, 1);
        if(state.minkowskiRefId === b.id) {
            state.minkowskiRefId = null;
            UI.btnSetMinkRef.textContent = '🎯 Отсчёт Минковского';
        }
        log(`Удалён ${b.id}`);
        deselectBody();
        updateObjListUI();
    }

    // ---------- BODY CLASS ----------
    const bhMat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `varying vec2 vUv; uniform float time; void main(){ float d=distance(vUv,vec2(0.5)); float r=smoothstep(0.45,0.5,d)*smoothstep(0.6,0.5,d); gl_FragColor=vec4(vec3(1,0.3,0)*r*2.0*(sin(time*5)*0.1+0.9),1); }`,
        transparent: true
    });

    class Body {
        constructor(opts) {
            this.id = opts.id || `obj_${Math.random().toString(36).slice(2,9)}`;
            this.mass = opts.mass || 1e20;
            this.density = opts.density || 3000;
            this.pos = new THREE.Vector3().fromArray(opts.pos || [0,0,0]);
            this.vel = new THREE.Vector3().fromArray(opts.vel || [0,0,0]);
            this.radius = Math.max(0.2, Math.cbrt((3*this.mass)/(4*Math.PI*this.density))*CFG.RENDER_SCALE);
            this.isBH = !!opts.isBH;
            if(this.isBH) this.radius = this.getSchwarzschildRadius()*1.5;
            this.color = this.computeColor();
            this.history = [];
            const geo = new THREE.SphereGeometry(this.radius, 24, 24);
            this.meshSide = new THREE.Mesh(geo, this.isBH ? bhMat.clone() : new THREE.MeshStandardMaterial({color:this.color, metalness:0.4, roughness:0.5}));
            this.meshIso  = new THREE.Mesh(geo, this.meshSide.material.clone());
            this.meshSide.position.copy(this.pos); this.meshIso.position.copy(this.pos);
            this.meshSide.userData = this.meshIso.userData = { body: this };
            const ring = new THREE.Mesh(new THREE.RingGeometry(this.radius*1.4, this.radius*1.5, 32), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, transparent:true, opacity:0.8}));
            ring.visible = false; this.selectionRing = ring;
            this.meshSide.add(ring); this.meshIso.add(ring.clone());
            this.trailPos = new Float32Array(CFG.TRAIL_LEN*3);
            this.trailGeo = new THREE.BufferGeometry();
            this.trailGeo.setAttribute('position', new THREE.BufferAttribute(this.trailPos,3));
            this.trailLine = new THREE.Line(this.trailGeo, new THREE.LineBasicMaterial({color:this.isBH?0xff5500:this.color, transparent:true, opacity:0.6}));
        }
        computeColor() {
            const h = (Math.log10(this.mass+1)/30)*270;
            const l = Math.max(5, 90 - (Math.log10(this.density+1)/17)*85);
            return `hsl(${h}, 85%, ${l}%)`;
        }
        getSchwarzschildRadius() {
            const G = state.units==='si'?CFG.G_SI:CFG.G_ASTRO, C = state.units==='si'?CFG.C_SI:CFG.C_ASTRO;
            return (2*G*this.mass)/(C*C)*CFG.RENDER_SCALE;
        }
        updateVisuals() {
            this.meshSide.position.copy(this.pos); this.meshIso.position.copy(this.pos);
            this.selectionRing.lookAt(camSide.position);
            if(this.isBH) this.meshSide.material.uniforms.time.value = state.time;
            const p = this.trailPos;
            for(let i=(CFG.TRAIL_LEN-1)*3; i>=3; i-=3) { p[i]=p[i-3]; p[i+1]=p[i-2]; p[i+2]=p[i-1]; }
            p[0]=this.pos.x; p[1]=this.pos.y; p[2]=this.pos.z;
            this.trailGeo.attributes.position.needsUpdate = true;
        }
        pushHistory() {
            this.history.push({x:this.pos.x, y:this.pos.y, t:state.time});
            if(this.history.length > CFG.TRAIL_LEN) this.history.shift();
        }
    }

    // ---------- PHYSICS ----------
    const physics = {
        bodies: [],
        add(opts) {
            if(this.bodies.length >= CFG.MAX_BODIES) { log('Лимит объектов'); return null; }
            const b = new Body(opts);
            this.bodies.push(b);
            sceneSide.add(b.meshSide, b.trailLine);
            sceneIso.add(b.meshIso, b.trailLine.clone());
            updateObjListUI();
            log(`Создан ${b.id}`);
            return b;
        },
        step(dt) {
            if(Math.abs(dt) < 1e-5 || this.bodies.length === 0) return;
            if(dt < 0) {
                if(state.historyBuffer.length === 0) return;
                const snap = state.historyBuffer.pop();
                state.time = snap.time;
                this.bodies.forEach((b, i) => {
                    if(snap.bodies[i]) { b.pos.fromArray(snap.bodies[i].pos); b.vel.fromArray(snap.bodies[i].vel); b.pushHistory(); }
                });
                return;
            }
            if(state.historyBuffer.length > CFG.HISTORY_BUF_LEN) state.historyBuffer.shift();
            state.historyBuffer.push({ time: state.time, bodies: this.bodies.map(b => ({pos: b.pos.toArray(), vel: b.vel.toArray()})) });
            const G = state.units==='si'?CFG.G_SI:CFG.G_ASTRO, C = state.units==='si'?CFG.C_SI:CFG.C_ASTRO;
            const eps = CFG.SOFTENING;
            const accels = this.bodies.map(()=>new THREE.Vector3());
            for(let i=0; i<this.bodies.length; i++) {
                const a = this.bodies[i];
                for(let j=i+1; j<this.bodies.length; j++) {
                    const b = this.bodies[j];
                    const diff = new THREE.Vector3().subVectors(b.pos, a.pos);
                    const d2 = diff.lengthSq() + eps*eps;
                    const F = diff.normalize().multiplyScalar((G*a.mass*b.mass)/d2);
                    let rel = 1;
                    if(state.relativity) rel += 3 * (a.vel.distanceToSquared(b.vel)/(C*C));
                    accels[i].addScaledVector(F, rel/a.mass);
                    accels[j].addScaledVector(F, -rel/b.mass);
                }
            }
            const dtEff = state.relativity ? dt*0.9 : dt;
            this.bodies.forEach((b,i) => { b.vel.addScaledVector(accels[i], dtEff); b.pos.addScaledVector(b.vel, dtEff); b.pushHistory(); });
            this.resolveCollisions();
            state.time += dt;
        },
        resolveCollisions() {
            const toRemove = [];
            const toAdd = [];
            for(let i=0; i<this.bodies.length; i++) {
                const a = this.bodies[i]; if(toRemove.includes(a)) continue;
                for(let j=i+1; j<this.bodies.length; j++) {
                    const b = this.bodies[j]; if(toRemove.includes(b)) continue;
                    const dist = a.pos.distanceTo(b.pos);
                    const minD = (a.radius + b.radius) * 0.75;
                    if(dist < minD) {
                        if(state.collisionMode === 'bh' && dist < Math.max(a.getSchwarzschildRadius(), b.getSchwarzschildRadius())*2) {
                            toRemove.push(a,b); toAdd.push({mass:a.mass+b.mass, density:1e18, pos:a.pos.toArray(), vel:[0,0,0], isBH:true}); continue;
                        }
                        switch(state.collisionMode) {
                            case 'merge':
                                toRemove.push(a,b);
                                const nm = a.mass+b.mass;
                                const np = a.pos.clone().multiplyScalar(a.mass).add(b.pos.clone().multiplyScalar(b.mass)).divideScalar(nm);
                                const nv = a.vel.clone().multiplyScalar(a.mass).add(b.vel.clone().multiplyScalar(b.mass)).divideScalar(nm);
                                toAdd.push({mass:nm, density:Math.max(a.density,b.density), pos:np.toArray(), vel:nv.toArray()}); break;
                            case 'elastic': {
                                const vRel = a.vel.clone().sub(b.vel);
                                const n = a.pos.clone().sub(b.pos).normalize();
                                const vN = vRel.dot(n);
                                if(vN > 0) break;
                                const j = -(1.8)*vN/(1/a.mass+1/b.mass);
                                a.vel.addScaledVector(n, j/a.mass); b.vel.addScaledVector(n, -j/b.mass);
                                const ov = (a.radius+b.radius)-dist;
                                a.pos.add(n.clone().multiplyScalar(ov*0.5)); b.pos.sub(n.clone().multiplyScalar(ov*0.5)); break;
                            }
                            case 'fragment':
                                toRemove.push(a,b);
                                const cnt=3, mPer=(a.mass+b.mass)/cnt;
                                const cen = a.pos.clone().add(b.pos).multiplyScalar(0.5);
                                for(let k=0;k<cnt;k++) toAdd.push({mass:mPer, density:a.density, pos:cen.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5,(Math.random()-0.5)*0.5,0)).toArray(), vel:new THREE.Vector3(Math.cos(k/cnt*Math.PI*2),Math.sin(k/cnt*Math.PI*2),0).multiplyScalar(0.8+Math.random()).toArray()});
                                break;
                        }
                    }
                }
            }
            toRemove.forEach(b => { sceneSide.remove(b.meshSide, b.trailLine); sceneIso.remove(b.meshIso, b.trailLine); b.meshSide.geometry.dispose(); b.meshSide.material.dispose(); });
            this.bodies = this.bodies.filter(b => !toRemove.includes(b));
            toAdd.forEach(nb => this.add(nb));
            if(toRemove.length > 0) { log(`Столкновение: -${toRemove.length}, +${toAdd.length}`); updateObjListUI(); }
        }
    };

    // ---------- 2D RENDER ----------
    function init2D(id) {
        const cont = document.getElementById(id);
        const cvs = document.createElement('canvas'); cont.appendChild(cvs);
        const ctx = cvs.getContext('2d');
        const resize = () => { cvs.width = cont.clientWidth; cvs.height = cont.clientHeight; };
        resize(); new ResizeObserver(resize).observe(cont);
        return { ctx, cvs, cont };
    }
    const c2dSide = init2D('vp-2d-side');
    const c2dTop  = init2D('vp-2d-top');
    const cMink   = init2D('vp-minkowski');

    function getContrastColor(hex) {
        const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        return (r*299+g*587+b*114)/1000 > 128 ? '#000' : '#fff';
    }

    function drawCurved(ctx, w, h, isTop) {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim();
        ctx.fillRect(0,0,w,h);
        const cx=w/2, cy=h/2, sc=state.zoom2D;
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim();
        ctx.globalAlpha=0.25; ctx.lineWidth=1;
        const warp=(x,y)=>{
            let dx=0,dy=0;
            physics.bodies.forEach(b=>{
                const bx=cx+b.pos.x*sc, by=cy-(isTop?b.pos.z:b.pos.y)*sc;
                const d2=(x-bx)**2+(y-by)**2, d=Math.sqrt(d2);
                if(d>2){ const f=(b.mass*1e-11)/(d2*0.001+50); dx+=(x-bx)/d*f*4000; dy+=(y-by)/d*f*4000; }
            });
            return {x:x+dx, y:y+dy};
        };
        const rng=350, step=25;
        for(let x=-rng; x<=rng; x+=step){ ctx.beginPath(); for(let y=-rng; y<=rng; y+=4){ const p=warp(cx+x,cy+y); y===-rng?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); } ctx.stroke(); }
        for(let y=-rng; y<=rng; y+=step){ ctx.beginPath(); for(let x=-rng; x<=rng; x+=4){ const p=warp(cx+x,cy+y); x===-rng?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); } ctx.stroke(); }
        ctx.globalAlpha=1;

        physics.bodies.forEach(b=>{
            const sx=cx+b.pos.x*sc, sy=cy-(isTop?b.pos.z:b.pos.y)*sc;
            ctx.beginPath(); ctx.arc(sx, sy, Math.max(4,b.radius*2), 0, Math.PI*2);
            ctx.fillStyle=b.color; ctx.fill();
            if(b.id===state.selectedBodyId){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke(); }
            const vx=b.vel.x*1.5, vy=-(isTop?b.vel.z:b.vel.y)*1.5;
            if(Math.hypot(vx,vy)>0.5){
                const vc=getContrastColor(b.color); ctx.strokeStyle=vc; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+vx,sy+vy); ctx.stroke();
                const ang=Math.atan2(vy,vx); ctx.fillStyle=vc; ctx.beginPath(); ctx.moveTo(sx+vx,sy+vy); ctx.lineTo(sx+vx-6*Math.cos(ang-0.5),sy+vy-6*Math.sin(ang-0.5)); ctx.lineTo(sx+vx-6*Math.cos(ang+0.5),sy+vy-6*Math.sin(ang+0.5)); ctx.closePath(); ctx.fill();
            }
        });
    }

    function drawMinkowski() {
        const {ctx,cvs}=cMink;
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim();
        ctx.fillRect(0,0,cvs.width,cvs.height);
        const cx=cvs.width/2, cy=cvs.height/2, sc=state.zoomMink;
        ctx.strokeStyle='#6b7280'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(cvs.width,cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,cvs.height); ctx.stroke();
        ctx.strokeStyle='rgba(245,158,11,0.4)'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+cvs.height/3,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-cvs.height/3,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+cvs.height/3,cvs.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-cvs.height/3,cvs.height); ctx.stroke();
        ctx.setLineDash([]);
        const refB = state.minkowskiRefId ? physics.bodies.find(b=>b.id===state.minkowskiRefId) : null;
        physics.bodies.forEach(b=>{
            if(b.history.length<2) return;
            ctx.strokeStyle=b.id===state.selectedBodyId?'#fff':b.color; ctx.lineWidth=b.id===state.selectedBodyId?3:2; ctx.globalAlpha=b.id===state.minkowskiRefId?1:0.7;
            ctx.beginPath(); const len=b.history.length, refLen=refB?refB.history.length:len, drawLen=Math.min(len,refLen);
            for(let i=0;i<drawLen;i++){
                let x=b.history[i].x; let t=b.history[i].t;
                if(refB&&refB.history[i]){ x=b.history[i].x-refB.history[i].x; }
                const px=cx+x*sc, py=cy-(t-(refB?refB.history[i].t:0))*0.8;
                i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
            }
            ctx.stroke();
            if(!state.isRewinding&&len>0){
                ctx.globalAlpha=0.4; ctx.setLineDash([4,4]); ctx.beginPath();
                const last=b.history[len-1]; let px=cx+(refB?last.x-refB.history[len-1].x:last.x)*sc, py=cy-(last.t-(refB?refB.history[len-1].t:0))*0.8;
                ctx.moveTo(px,py);
                const relVelX=refB?b.vel.x-refB.vel.x:b.vel.x;
                for(let k=1;k<=20;k++){ px+=relVelX*0.3*sc*0.1; py-=0.3*0.8; ctx.lineTo(px,py); }
                ctx.stroke(); ctx.setLineDash([]);
            }
            ctx.globalAlpha=1;
            if(b.id===state.minkowskiRefId){ ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,cvs.height); ctx.stroke(); ctx.setLineDash([]); }
        });
        ctx.fillStyle='#9ca3af'; ctx.font='bold 11px Inter'; ctx.fillText('ct',cx+8,18); ctx.fillText('x',cvs.width-90,cy-8);
    }

    // ---------- LOOP ----------
    let rafId;
    function loop() {
        rafId=requestAnimationFrame(loop);
        if(state.running){ physics.step(CFG.DT_BASE*state.timeScale); physics.bodies.forEach(b=>b.updateVisuals()); }
        rSide.ctrl.update(); rIso.ctrl.update();
        rSide.ren.render(sceneSide,camSide); rIso.ren.render(sceneIso,camIso);
        drawCurved(c2dSide.ctx,c2dSide.cvs.width,c2dSide.cvs.height,false);
        drawCurved(c2dTop.ctx,c2dTop.cvs.width,c2dTop.cvs.height,true);
        drawMinkowski();
        UI.statusText.textContent=`T=${state.time.toFixed(1)}s | ${state.isRewinding?'⏪':'▶'} x${Math.abs(state.timeScale).toFixed(1)} | ${physics.bodies.length} тел`;
    }

    // ---------- EVENTS ----------
    UI.themeSel.onchange=e=>applyTheme(e.target.value);
    UI.unitSel.onchange=e=>{ state.units=e.target.value; log(`Единицы: ${state.units.toUpperCase()}`); };
    UI.relToggle.onchange=e=>{ state.relativity=e.target.checked; log(`Релятивизм: ${state.relativity?'ON':'OFF'}`); };
    UI.collMode.onchange=e=>{ state.collisionMode=e.target.value; log(`Столкновения: ${e.target.value}`); };
    UI.stopBtn.onclick=()=>{ state.running=false; state.timeScale=0; UI.statusText.textContent='⛔ Остановлено'; cancelAnimationFrame(rafId); };
    UI.playPauseBtn.onclick=()=>{ state.running=!state.running; UI.playPauseBtn.textContent=state.running?'⏸':'▶'; };
    UI.timeScaleSlider.oninput=e=>{ state.timeScale=parseFloat(e.target.value); const sign=state.timeScale>=0?'':'⏪ '; UI.timeScaleVal.textContent=`${sign}x${Math.abs(state.timeScale).toFixed(1)}`; state.isRewinding=state.timeScale<0; };
    document.getElementById('zoom3D')?.addEventListener('input', e => updateCameraZoom(parseFloat(e.target.value)));
    // Zoom sliders handled via header inline, so add them:
    const zoom3DSlider = document.createElement('input');
    zoom3DSlider.type='range'; zoom3DSlider.min='15'; zoom3DSlider.max='300'; zoom3DSlider.value='80'; zoom3DSlider.id='zoom3D';
    zoom3DSlider.style.width='80px'; zoom3DSlider.title='Масштаб 3D';
    const zoom2DSlider = document.createElement('input');
    zoom2DSlider.type='range'; zoom2DSlider.min='0.5'; zoom2DSlider.max='5'; zoom2DSlider.step='0.1'; zoom2DSlider.value='2'; zoom2DSlider.id='zoom2D';
    zoom2DSlider.style.width='80px'; zoom2DSlider.title='Масштаб 2D';
    const zoomMinkSlider = document.createElement('input');
    zoomMinkSlider.type='range'; zoomMinkSlider.min='5'; zoomMinkSlider.max='20'; zoomMinkSlider.step='1'; zoomMinkSlider.value='10'; zoomMinkSlider.id='zoomMink';
    zoomMinkSlider.style.width='80px'; zoomMinkSlider.title='Масштаб Минковского';
    const zoomGroup = document.createElement('div'); zoomGroup.className='control-group desktop-only';
    zoomGroup.innerHTML='<span class="control-label">3D</span>'; zoomGroup.appendChild(zoom3DSlider);
    zoomGroup.innerHTML+='<span class="control-label">2D</span>'; zoomGroup.appendChild(zoom2DSlider);
    zoomGroup.innerHTML+='<span class="control-label">Минк</span>'; zoomGroup.appendChild(zoomMinkSlider);
    document.getElementById('header').insertBefore(zoomGroup, document.getElementById('stopBtn'));
    zoom3DSlider.oninput=e=>updateCameraZoom(parseFloat(e.target.value));
    zoom2DSlider.oninput=e=>{ state.zoom2D=parseFloat(e.target.value); };
    zoomMinkSlider.oninput=e=>{ state.zoomMink=parseFloat(e.target.value); };

    document.getElementById('btnAddBody').onclick=()=>{
        const m=parseFloat($('#inpMass').value)||1e12;
        const d=parseFloat($('#inpDensity').value)||3000;
        const p=$('#inpPos').value.split(',').map(Number);
        const v=$('#inpVel').value.split(',').map(Number);
        if(p.length!==3||v.length!==3){ log('Ошибка формата позиции/скорости'); return; }
        physics.add({mass:m,density:d,pos:p,vel:v});
    };
    UI.btnDeleteSelected.onclick=deleteSelectedBody;
    UI.btnResetCam.onclick=()=>{ updateCameraZoom(80); zoom3DSlider.value=80; [rSide.ctrl,rIso.ctrl].forEach(c=>c.reset()); };
    UI.btnSetMinkRef.onclick=()=>{
        if(state.selectedBodyId){
            if(state.minkowskiRefId===state.selectedBodyId){ state.minkowskiRefId=null; UI.btnSetMinkRef.textContent='🎯 Отсчёт Минковского'; }
            else { state.minkowskiRefId=state.selectedBodyId; UI.btnSetMinkRef.textContent=`🎯 Отсчёт: ${state.selectedBodyId}`; }
        } else log('Сначала выберите объект!');
        updateObjListUI();
    };

    // Panel toggle
    UI.panelToggleBtn.onclick=()=>UI.sidePanel.classList.toggle('open');
    UI.closePanelBtn.onclick=()=>UI.sidePanel.classList.remove('open');
    // Close panel on overlay click outside
    UI.sidePanel.addEventListener('click',e=>{ if(e.target===UI.sidePanel) UI.sidePanel.classList.remove('open'); });
    // Tabs
    $$('.tab-btn').forEach(b=>b.onclick=()=>{ $$('.tab-btn').forEach(btn=>btn.classList.remove('active')); b.classList.add('active'); $$('.tab-content').forEach(p=>p.classList.remove('active')); document.getElementById(`panel-${b.dataset.panel}`).classList.add('active'); });
    // Hamburger mobile
    UI.hamburgerBtn.onclick=()=>UI.header.classList.toggle('expanded');

    // Hotkeys
    window.addEventListener('keydown', e => {
        if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
        switch(e.key) {
            case ' ': e.preventDefault(); state.running=!state.running; UI.playPauseBtn.textContent=state.running?'⏸':'▶'; break;
            case 'Delete': deleteSelectedBody(); break;
            case 'r': case 'R': updateCameraZoom(80); zoom3DSlider.value=80; [rSide.ctrl,rIso.ctrl].forEach(c=>c.reset()); break;
            case 'f': case 'F': if(state.selectedBodyId){ const b=physics.bodies.find(b=>b.id===state.selectedBodyId); if(b){ camSide.lookAt(b.pos); camIso.lookAt(b.pos); rSide.ctrl.target.copy(b.pos); rIso.ctrl.target.copy(b.pos); } } break;
        }
    });

    // Import JSON fix
    document.getElementById('importBtn').onclick = () => {
        const fi = document.getElementById('fileInput');
        fi.onchange = e => {
            const f = e.target.files[0]; if(!f) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const d = JSON.parse(ev.target.result);
                    physics.bodies.forEach(b=>{ sceneSide.remove(b.meshSide,b.trailLine); sceneIso.remove(b.meshIso,b.trailLine); });
                    physics.bodies=[]; state.historyBuffer=[];
                    if(d.meta){ state.time=d.meta.time; state.units=d.meta.units; UI.unitSel.value=state.units; state.minkowskiRefId=d.meta.ref||null; }
                    d.bodies.forEach(b=>physics.add({id:b.id,mass:b.mass,density:b.density,isBH:b.isBH,pos:b.pos,vel:b.vel}));
                    log('Сцена загружена');
                } catch(err){ log('Ошибка JSON: '+err.message); }
                fi.value='';
            };
            reader.readAsText(f);
        };
        fi.click();
    };

    // Global app functions
    window.app = {
        saveJSON: ()=>downloadFile(JSON.stringify({meta:{time:state.time,units:state.units,ref:state.minkowskiRefId},bodies:physics.bodies.map(b=>({id:b.id,mass:b.mass,density:b.density,isBH:b.isBH,pos:b.pos.toArray(),vel:b.vel.toArray()}))},null,2),`sim_T${state.time.toFixed(1)}.json`,'application/json'),
        saveCSV: ()=>{ let c="ID,T,X,Y,Z,VX,VY,VZ\n"; physics.bodies.forEach(b=>c+=`${b.id},${state.time.toFixed(4)},${b.pos.x},${b.pos.y},${b.pos.z},${b.vel.x},${b.vel.y},${b.vel.z}\n`); downloadFile(c,`coords_T${state.time.toFixed(1)}.csv`,'text/csv'); },
        saveLogs: ()=>downloadFile(state.logs.join('\n'),`logs_T${state.time.toFixed(1)}.txt`,'text/plain'),
        clearLogs: ()=>{ state.logs=[]; UI.logBox.textContent=''; },
        addPreset: (type) => {
            const presets = {
                star: {mass:1e20, density:5000, pos:[30,0,0], vel:[0,3.5,0]},
                planet: {mass:5e12, density:3000, pos:[0,25,0], vel:[2.8,0,0]},
                bh: {mass:8e15, density:1e18, pos:[-30,0,0], vel:[0,-1.8,0], isBH:true}
            };
            const p = presets[type];
            physics.add({mass:p.mass, density:p.density, pos:[p.pos[0]+(Math.random()-0.5)*10, p.pos[1]+(Math.random()-0.5)*10, p.pos[2]+(Math.random()-0.5)*10], vel:p.vel, isBH:p.isBH||false});
        },
        saveScreenshots: async () => {
            const zip = new JSZip();
            const canvases = {
                '3d_side': rSide.ren.domElement,
                '3d_iso': rIso.ren.domElement,
                '2d_side': c2dSide.cvs,
                '2d_top': c2dTop.cvs,
                'minkowski': cMink.cvs
            };
            for(const [name, canvas] of Object.entries(canvases)) {
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                zip.file(`${name}.png`, blob);
            }
            const content = await zip.generateAsync({type:'blob'});
            downloadFile(content, `gravity_screenshots_${Date.now()}.zip`, 'application/zip');
            log('Скриншоты сохранены в ZIP');
        }
    };

    function downloadFile(content, filename, mime) {
        const blob = content instanceof Blob ? content : new Blob([content], {type:mime});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    window.addEventListener('resize',()=>{ [rSide,rIso].forEach(r=>{ const w=r.cont.clientWidth,h=r.cont.clientHeight; r.cam.aspect=w/h; r.cam.updateProjectionMatrix(); r.ren.setSize(w,h); }); });

    // Initial bodies
    physics.add({mass:5e12, density:3000, pos:[-25,0,0], vel:[0,2.5,0]});
    physics.add({mass:5e12, density:3000, pos:[25,0,0], vel:[0,-2.5,0]});
    physics.add({mass:1e11, density:2000, pos:[0,35,0], vel:[3.5,0,0]});

    log('Gravity Pro — улучшенный интерфейс');
    UI.statusText.textContent = 'Готов | Space=пауза, R=сброс, Del=удалить';
    rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
